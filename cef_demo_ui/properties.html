<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube Properties</title><link rel="stylesheet" href="style.css"></head><body data-panel="properties"><main><h1>Properties</h1><div id="selected">Selected Object: none</div><p>Drag a coordinate label or type a value.</p><div class="property-row"><label class="drag-axis" data-axis="tx" for="tx">Tx</label><input id="tx" type="number" step="0.1" disabled></div><div class="property-row"><label class="drag-axis" data-axis="ty" for="ty">Ty</label><input id="ty" type="number" step="0.1" disabled></div><div class="property-row"><label class="drag-axis" data-axis="tz" for="tz">Tz</label><input id="tz" type="number" step="0.1" disabled></div><div id="message">Select a cube to edit it.</div></main><script src="bridge.js"></script><script src="properties.js"></script></body></html>
